name: Kripto Asistan (Soru-Cevap + Zamanlı Mail + Fiyat Alarmları)

# Admin Telegram'da bota özelden yazdığında birkaç dakika içinde cevap versin,
# "şu gün şu saatte mail at" görevleri zamanında gitsin ve fiyat alarmları
# ("BTC 65000'i geçerse haber ver") anında tetiklensin diye her çalıştırmada
# "kontrol" job'ı bakar. Claude Code CLI kurulumu (yavaş adım) SADECE
# gerçekten cevaplanacak bir mesaj/gönderilecek mail varsa çalışır — fiyat
# alarmı kontrolü Claude gerektirmediği için HER ZAMAN "kontrol" job'ının
# ucuz tarafında (CoinGecko + Telegram) yapılır.
#
# NOT: GitHub'ın kendi cron zamanlayıcısı bu repo için güvenilmez bulundu
# (bkz. proje notları) — asıl tetikleme dışarıdan cron-job.org ile her birkaç
# dakikada bir workflow_dispatch çağrılarak yapılıyor. Aşağıdaki `schedule`
# sadece best-effort bir yedek.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:            # GitHub arayüzünden elle çalıştırma (test için)

concurrency:
  group: asistan
  cancel-in-progress: false

jobs:
  kontrol:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      mesaj_var: ${{ steps.kontrol.outputs.mesaj_var }}
    steps:
      - name: Repoyu çek
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3.11 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python bağımlılıklarını kur
        run: pip install -r requirements.txt

      - name: Yeni mesaj / vadesi gelmiş görev var mı bak + fiyat alarmlarını kontrol et (Claude'a dokunmadan)
        id: kontrol
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: python asistan.py --kontrol

      - name: Durumu kaydet (tetiklenen alarmlar)
        run: |
          if [ -f state/alarmlar.json ] && [ -n "$(git status --porcelain state/alarmlar.json 2>/dev/null)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/alarmlar.json
            git commit -m "chore: alarm durumu"
            git pull --rebase --autostash origin main || true
            git push || echo "push basarisiz (best-effort)"
          else
            echo "alarm durumu degismedi"
          fi

  cevapla:
    needs: kontrol
    if: needs.kontrol.outputs.mesaj_var == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Repoyu çek
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3.11 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Node.js kur (Claude Code CLI için)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Python bağımlılıklarını kur
        run: pip install -r requirements.txt

      - name: Claude Code CLI kur
        run: npm install -g @anthropic-ai/claude-code

      - name: Bekleyen soruları cevapla ve vadesi gelen mailleri gönder
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TELEGRAM_BOT_TOKEN:      ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID:  ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          SMTP_GMAIL_ADRES:        ${{ secrets.SMTP_GMAIL_ADRES }}
          SMTP_UYGULAMA_SIFRESI:   ${{ secrets.SMTP_UYGULAMA_SIFRESI }}
          ALICI_EMAIL:             ${{ secrets.ALICI_EMAIL }}
        run: python asistan.py

      - name: Durumu kaydet
        run: |
          degisti=false
          for f in state/asistan.json state/gorevler.json state/hafiza.json state/alarmlar.json; do
            if [ -f "$f" ] && [ -n "$(git status --porcelain "$f" 2>/dev/null)" ]; then
              git add "$f"
              degisti=true
            fi
          done
          if [ "$degisti" = true ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: asistan durumu"
            git pull --rebase --autostash origin main || true
            git push || echo "push basarisiz (best-effort)"
          else
            echo "durum degismedi"
          fi
