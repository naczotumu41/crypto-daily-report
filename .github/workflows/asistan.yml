name: Kripto Asistan (Soru-Cevap + Zamanlı Mail + Fiyat Alarmları)

# Admin Telegram'da bota özelden yazdığında birkaç dakika içinde cevap versin,
# "şu gün şu saatte mail at" görevleri zamanında gitsin ve fiyat alarmları
# ("BTC 65000'i geçerse haber ver") anında tetiklensin diye her çalıştırmada
# "kontrol" job'ı bakar. Claude Code CLI kurulumu (yavaş adım) SADECE
# gerçekten cevaplanacak bir mesaj/gönderilecek mail varsa çalışır — fiyat
# alarmı kontrolü Claude gerektirmediği için HER ZAMAN "kontrol" job'ının
# ucuz tarafında (CoinGecko + Telegram) yapılır.
#
# NOT: GitHub'ın kendi cron zamanlayıcısı bu repo için güvenilmez bulundu
# (bkz. proje notları) — asıl tetikleme dışarıdan cron-job.org ile her birkaç
# dakikada bir workflow_dispatch çağrılarak yapılıyor. Aşağıdaki `schedule`
# sadece best-effort bir yedek.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:            # GitHub arayüzünden elle çalıştırma (test için)
    inputs:
      mod:
        description: "normal: her zamanki çalışma. sohbetleri-listele: grup/kanal chat_id'sini bulmak için tek seferlik kurulum aracı (önce gruba/kanala bir mesaj at)."
        type: choice
        options:
          - normal
          - sohbetleri-listele
        default: normal

concurrency:
  group: asistan
  cancel-in-progress: false

jobs:
  sohbetleri-listele:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mod == 'sohbetleri-listele' }}
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu çek
        uses: actions/checkout@v4

      - name: Python 3.11 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python bağımlılıklarını kur
        run: pip install -r requirements.txt

      - name: Son sohbetleri listele (grup chat_id'sini bulmak için)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python asistan.py --sohbetleri-listele

  kontrol:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mod == 'normal' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      mesaj_var: ${{ steps.kontrol.outputs.mesaj_var }}
    steps:
      - name: Repoyu çek
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3.11 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python bağımlılıklarını kur
        run: pip install -r requirements.txt

      - name: Yeni mesaj / vadesi gelmiş görev var mı bak + fiyat alarmlarını kontrol et (Claude'a dokunmadan)
        id: kontrol
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          TELEGRAM_GRUP_CHAT_ID: ${{ secrets.TELEGRAM_GRUP_CHAT_ID }}
          TELEGRAM_KANAL_CHAT_ID: ${{ secrets.TELEGRAM_KANAL_CHAT_ID }}
        run: python asistan.py --kontrol

      - name: Durumu kaydet (tetiklenen alarmlar)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          if [ -f state/alarmlar.json ] && [ -n "$(git status --porcelain state/alarmlar.json 2>/dev/null)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/alarmlar.json
            git commit -m "chore: alarm durumu"
            basarili=false
            for deneme in 1 2 3 4 5; do
              git rebase --abort >/dev/null 2>&1 || true
              if git pull --rebase --autostash origin main && git push; then
                basarili=true
                break
              fi
              echo "[uyarı] Push denemesi $deneme/5 başarısız, tekrar deneniyor..."
              git rebase --abort >/dev/null 2>&1 || true
              sleep $((deneme * 4))
            done
            if [ "$basarili" != true ]; then
              echo "::error::Alarm durumu 5 denemede de push edilemedi — bir sonraki çalışmada aynı alarm tekrar bildirilebilir!"
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -d "chat_id=${TELEGRAM_ADMIN_CHAT_ID}" \
                -d "text=⚠️ Bot durumu (alarm) GitHub'a kaydedilemedi, birkaç deneme başarısız oldu. Bir sonraki çalışmada aynı bildirim tekrarlanabilir." \
                >/dev/null || true
              exit 1
            fi
          else
            echo "alarm durumu degismedi"
          fi

  cevapla:
    needs: kontrol
    if: needs.kontrol.outputs.mesaj_var == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Repoyu çek
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3.11 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Node.js kur (Claude Code CLI için)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Python bağımlılıklarını kur
        run: pip install -r requirements.txt

      - name: Claude Code CLI kur
        run: npm install -g @anthropic-ai/claude-code

      - name: Bekleyen soruları cevapla ve vadesi gelen mailleri gönder
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TELEGRAM_BOT_TOKEN:      ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID:  ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          TELEGRAM_GRUP_CHAT_ID:   ${{ secrets.TELEGRAM_GRUP_CHAT_ID }}
          TELEGRAM_KANAL_CHAT_ID:  ${{ secrets.TELEGRAM_KANAL_CHAT_ID }}
          SMTP_GMAIL_ADRES:        ${{ secrets.SMTP_GMAIL_ADRES }}
          SMTP_UYGULAMA_SIFRESI:   ${{ secrets.SMTP_UYGULAMA_SIFRESI }}
          ALICI_EMAIL:             ${{ secrets.ALICI_EMAIL }}
        run: python asistan.py

      - name: Durumu kaydet
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          degisti=false
          for f in state/asistan.json state/gorevler.json state/hafiza.json state/alarmlar.json state/portfoy.json state/haber_izleme.json; do
            if [ -f "$f" ] && [ -n "$(git status --porcelain "$f" 2>/dev/null)" ]; then
              git add "$f"
              degisti=true
            fi
          done
          if [ "$degisti" = true ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: asistan durumu"
            basarili=false
            for deneme in 1 2 3 4 5; do
              git rebase --abort >/dev/null 2>&1 || true
              if git pull --rebase --autostash origin main && git push; then
                basarili=true
                break
              fi
              echo "[uyarı] Push denemesi $deneme/5 başarısız, tekrar deneniyor..."
              git rebase --abort >/dev/null 2>&1 || true
              sleep $((deneme * 4))
            done
            if [ "$basarili" != true ]; then
              echo "::error::Durum 5 denemede de push edilemedi — bir sonraki çalışmada aynı mesaj tekrar cevaplanabilir!"
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -d "chat_id=${TELEGRAM_ADMIN_CHAT_ID}" \
                -d "text=⚠️ Bot durumu GitHub'a kaydedilemedi, birkaç deneme başarısız oldu. Bir sonraki çalışmada aynı mesaj tekrar cevaplanabilir — lütfen kontrol edin." \
                >/dev/null || true
              exit 1
            fi
          else
            echo "durum degismedi"
          fi
